<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Trigli</title>
    <base href="/" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Evita el destello claro al abrir si elegiste oscuro (o automático con el sistema en oscuro). */
      try {
        var m = localStorage.getItem('trigli-theme');
        if (m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('ion-palette-dark');
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#0F3D3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@800&display=swap" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
